# cargo-features = ["edition2024"]
[package]
name = "briscola"
version = "0.1.0"
authors = ["michael-zucchetta <michael.zucchetta@protonmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
ansi_term = "0.12.1"
rand = { version = "0.8.5"  }
rand_core = { version = "0.6.4" }
# not working yew = { version = "0.21.0", package = "yew" }
yew = { git = "https://github.com/yewstack/yew" }
web-sys = { version = "0.3.70", package = "web-sys" }
wasm-bindgen = "0.2.93"
