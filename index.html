<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Briscola</title>
        <style>
            html,
            body {
                margin: 0;
                min-height: 100%;
                background: #000;
            }

            body {
                min-height: 100vh;
            }

            body[data-production-theme="white"] {
                background: #fff;
            }

            .visually-hidden {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip-path: inset(50%);
                white-space: nowrap;
            }
        </style>
        <script type="module">
            import init from "./demo/wasm.js"
            await init()
        </script>
    </head>
    <body data-production-theme="white">
        <div id="briscola-app"></div>
        <p id="card-zoom-help" class="visually-hidden">Hover or focus a card to enlarge it. On touch screens, tap to enlarge, then tap the same card again to play. Tap outside or press Escape to close.</p>
    </body>
</html>
